name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goarch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: project/backend/go.mod
          cache-dependency-path: project/backend/go.sum

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "$VER" > VERSION

      - name: Install pack deps
        run: sudo apt-get update -y && sudo apt-get install -y curl ca-certificates unzip tar gzip

      - name: Pack release
        run: |
          chmod +x utils/pack-release.sh utils/fetch-realm.sh
          ./utils/pack-release.sh "${{ steps.ver.outputs.ver }}" "${{ matrix.goarch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: realmforward-linux-${{ matrix.goarch }}
          path: dist/realmforward-v${{ steps.ver.outputs.ver }}-linux-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: realmforward-linux-*
          merge-multiple: true

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Realm Forward Panel v${{ steps.ver.outputs.ver }}
          generate_release_notes: true
          files: |
            dist/realmforward-v${{ steps.ver.outputs.ver }}-linux-amd64.tar.gz
            dist/realmforward-v${{ steps.ver.outputs.ver }}-linux-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
